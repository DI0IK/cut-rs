[package]
name = "cut-rs"
version = "0.3.1"
edition = "2024"
description = "Crowdsourced AI quota telemetry server, estimator, and local CLI"
license = "MIT"
repository = "https://github.com/DI0IK/cut-rs"
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
dirs = "6.0"
hex = "0.4"
hmac = "0.12"
mime_guess = "2"
nalgebra = "0.33"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
statrs = "0.18"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.19"
http-body-util = "0.1"
