[package]
name = "cut-rs"
version = "0.4.6"
edition = "2024"
description = "Local Antigravity AI quota tracker, Waybar module, and on-demand cost estimator"
license = "MIT"
repository = "https://github.com/DI0IK/cut-rs"
readme = "README.md"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
hex = "0.4"
mime_guess = "2"
nalgebra = "0.33"
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
statrs = "0.18"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.19"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
